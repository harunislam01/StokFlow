version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: electromtech_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Set POSTGRES_PASSWORD in a root .env file before deploying (see .env.example).
      # Use a URL-safe value (letters, digits, - and _) so it fits in DATABASE_URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - create a .env file}
      POSTGRES_DB: electromtech_stok
    # Bind database port only to localhost (127.0.0.1) for security.
    # This prevents direct access to the database from the public internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d electromtech_stok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: electromtech_backend_prod
    restart: always
    # Load production environment file
    env_file:
      - ./backend/.env.production
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/electromtech_stok?schema=public
      # Leave empty when the frontend is served through the same origin (Nginx /api proxy).
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: electromtech_frontend_prod
    restart: always
    # Exposes port 80 to the host. In a production server, you can proxy this 
    # to port 443 with SSL/HTTPS using Nginx or Caddy on the host system.
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data_prod:
